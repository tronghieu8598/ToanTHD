<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vòng Quay Lượng Giác - Chuẩn Toán Học</title>
    <!-- MathJax để render chuẩn xác mọi ký hiệu và phân số LaTeX -->
    <script>
        window.MathJax = {
            tex: { inlineMath: [['$', '$'], ['\\(', '\\)']] },
            svg: { fontCache: 'global' }
        };
    </script>
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    
    <style>
        :root {
            --primary: #2563eb;
            --primary-dark: #1d4ed8;
            --secondary: #059669;
            --accent: #d97706;
            --negative: #dc2626;
            --bg-page: #f1f5f9;
            --card-bg: #ffffff;
            --card-border: #cbd5e1;
            --text-main: #0f172a;
            --text-muted: #475569;
        }

        * { box-sizing: border-box; }

        body {
            font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
            background: linear-gradient(135deg, #f8fafc 0%, #e2e8f0 100%);
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px 15px;
            margin: 0;
            min-height: 100vh;
        }

        h2 {
            margin: 0 0 16px 0;
            color: #1e1b4b;
            text-transform: uppercase;
            font-size: 1.45em;
            letter-spacing: 0.5px;
            text-align: center;
            font-weight: 800;
        }

        .container {
            display: flex;
            flex-wrap: wrap;
            gap: 24px;
            justify-content: center;
            max-width: 1240px;
            width: 100%;
        }

        .canvas-card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 18px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.08);
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        canvas {
            background: #ffffff;
            border-radius: 14px;
            border: 1.5px solid #94a3b8;
            box-shadow: inset 0 2px 6px rgba(0, 0, 0, 0.04);
            cursor: grab;
        }
        canvas:active { cursor: grabbing; }

        .canvas-options {
            display: flex;
            gap: 20px;
            margin-top: 14px;
            font-size: 0.95em;
            color: #1e293b;
            font-weight: 600;
        }

        .canvas-options label {
            display: flex;
            align-items: center;
            gap: 6px;
            cursor: pointer;
        }
        .canvas-options input[type="checkbox"] {
            accent-color: var(--primary-dark);
            cursor: pointer;
            transform: scale(1.1);
        }

        .controls {
            display: flex;
            flex-direction: column;
            gap: 18px;
            flex: 1;
            min-width: 340px;
            max-width: 460px;
        }

        .panel {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 16px;
            padding: 18px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.05);
        }

        .mode-switch {
            display: flex;
            background: #e2e8f0;
            padding: 5px;
            border-radius: 10px;
            gap: 6px;
            border: 1px solid #cbd5e1;
        }
        .mode-btn {
            flex: 1;
            padding: 9px 12px;
            border: none;
            background: transparent;
            color: #334155;
            border-radius: 8px;
            cursor: pointer;
            font-family: inherit;
            font-weight: 700;
            font-size: 0.95em;
            transition: all 0.2s ease;
        }
        .mode-btn.active {
            background: #ffffff;
            color: var(--primary-dark);
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.12);
        }

        button.action-btn {
            padding: 12px 16px;
            border-radius: 10px;
            cursor: pointer;
            font-family: inherit;
            font-weight: 700;
            font-size: 1.02em;
            transition: transform 0.15s, opacity 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            width: 100%;
        }
        button.action-btn:active { transform: scale(0.98); }

        .btn-check {
            background: linear-gradient(135deg, #1d4ed8, #1e40af);
            color: #ffffff;
            border: none;
            box-shadow: 0 4px 12px rgba(29, 78, 216, 0.28);
            margin-top: 14px;
        }
        .btn-next {
            background: linear-gradient(135deg, #d97706, #b45309);
            color: #ffffff;
            border: none;
            box-shadow: 0 4px 12px rgba(217, 119, 6, 0.25);
            margin-top: 10px;
        }
        .btn-reset {
            background: #f8fafc;
            color: #0f172a;
            border: 1.5px solid #cbd5e1;
            font-size: 0.95em;
            padding: 10px;
        }
        .btn-reset:hover { 
            background: #f1f5f9; 
            border-color: #94a3b8;
        }

        .quiz-box {
            border: 2px dashed #f59e0b;
            background: #fffbeb;
            text-align: center;
        }

        .score-board {
            display: flex;
            justify-content: space-between;
            background: #ffffff;
            border: 1.5px solid #fed7aa;
            padding: 10px 16px;
            border-radius: 10px;
            font-weight: 700;
            margin-bottom: 14px;
            font-size: 1em;
            color: #0f172a;
        }

        .quiz-target-wrap {
            min-height: 80px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 8px 0;
        }

        .quiz-target {
            font-size: 2.3em;
            color: #9a3412;
            font-weight: bold;
        }

        .quiz-status {
            font-weight: 600;
            font-size: 0.95em;
            min-height: 52px;
            margin-top: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 10px;
            padding: 10px 14px;
            line-height: 1.45;
            border: 1.5px solid transparent;
        }
        .status-neutral { background: #f1f5f9; color: #1e293b; border-color: #cbd5e1; }
        .status-success { background: #dcfce7; color: #14532d; border-color: #86efac; }
        .status-warning { background: #fef3c7; color: #78350f; border-color: #fde68a; }
        .status-fail { background: #fee2e2; color: #7f1d1d; border-color: #fca5a5; }
    </style>
</head>
<body>

    <h2>⚡ Thử Thách Góc Lượng Giác (Hệ Chia 15°) ⚡</h2>
    
    <div class="container">
        <div class="canvas-card">
            <div style="font-size: 0.92em; color: #0f172a; margin-bottom: 12px; font-weight: 700;">
                🎯 Kéo điểm <b>M</b> đạt đúng góc lượng giác theo vạch thước 15°
            </div>
            <canvas id="mathCanvas" width="500" height="500"></canvas>
            <div class="canvas-options">
                <label><input type="checkbox" id="cbProtractor" checked> Vành Thước 15°</label>
                <label><input type="checkbox" id="cbQuadrants" checked> 4 Góc Phần Tư</label>
                <label><input type="checkbox" id="cbPointer"> Tia Gợi Ý (Luyện tập)</label>
            </div>
        </div>

        <div class="controls">
            
            <div class="panel">
                <div class="mode-switch">
                    <button class="mode-btn active" id="btnDeg" onclick="setMode('deg')">Hệ Độ (°)</button>
                    <button class="mode-btn" id="btnRad" onclick="setMode('rad')">Hệ Radian (rad)</button>
                </div>
                <button class="action-btn btn-reset" onclick="resetToZero()" style="margin-top: 12px;">
                    🔄 Đặt lại về vị trí ban đầu (0°)
                </button>
            </div>

            <div class="panel quiz-box">
                <div class="score-board">
                    <div>Số câu đúng: <span id="txtTotalQuiz" style="color: #047857; font-size: 1.15em;">0</span></div>
                    <div>Điểm: <span id="txtTotalScore" style="color: #1d4ed8; font-size: 1.15em;">0</span></div>
                </div>

                <div style="font-size: 0.9em; color: #78350f; text-transform: uppercase; font-weight: 800; letter-spacing: 0.4px;">
                    Yêu cầu biểu diễn góc:
                </div>
                <div class="quiz-target-wrap">
                    <div class="quiz-target" id="quizTargetText">Bấm bắt đầu...</div>
                </div>
                
                <button class="action-btn btn-check" onclick="checkQuizAnswer()">
                    ✔️ Bấm Kiểm Tra Kết Quả
                </button>
                
                <div class="quiz-status status-neutral" id="quizStatus">
                    Bấm nút "Phát Đề Bài Mới" để bắt đầu làm bài!
                </div>
                <button class="action-btn btn-next" onclick="generateNewQuiz()">
                    🎲 Phát Đề Bài Mới
                </button>
            </div>

        </div>
    </div>

    <script>
        const canvas = document.getElementById('mathCanvas');
        const ctx = canvas.getContext('2d');
        
        const centerX = canvas.width / 2;
        const centerY = canvas.height / 2;
        const radius = 155; 

        let currentAngle = 0; 
        let currentMode = 'deg'; 
        let isDragging = false;
        let previousAngle = 0; 

        let targetAngle = null; 
        let correctAnswersCount = 0;
        let totalScore = 0;
        let hasCheckedCurrentQuiz = true;

        // Sinh công thức LaTeX chuẩn cho hệ Radian
        function getLatexRad(deg) {
            if (deg === 0) return '0\\text{ rad}';
            const gcd = (a, b) => b ? gcd(b, a % b) : Math.abs(a);
            let sign = deg < 0 ? '-' : '';
            let absDeg = Math.abs(deg);
            let d = gcd(absDeg, 180);
            let num = absDeg / d;
            let den = 180 / d;

            if (den === 1) {
                return num === 1 ? `${sign}\\pi\\text{ rad}` : `${sign}${num}\\pi\\text{ rad}`;
            } else {
                let numStr = (num === 1) ? '\\pi' : `${num}\\pi`;
                return `${sign}\\frac{${numStr}}{${den}}\\text{ rad}`;
            }
        }

        function setMode(mode) {
            currentMode = mode;
            document.getElementById('btnDeg').className = mode === 'deg' ? 'mode-btn active' : 'mode-btn';
            document.getElementById('btnRad').className = mode === 'rad' ? 'mode-btn active' : 'mode-btn';
            updateQuizDisplay();
        }

        function drawQuadrants() {
            const colors = [
                'rgba(59, 130, 246, 0.08)',
                'rgba(16, 185, 129, 0.08)',
                'rgba(245, 158, 11, 0.08)',
                'rgba(168, 85, 247, 0.08)'
            ];
            const angles = [
                [0, -Math.PI / 2, true],
                [-Math.PI / 2, -Math.PI, true],
                [-Math.PI, -1.5 * Math.PI, true],
                [-1.5 * Math.PI, 0, true]
            ];

            angles.forEach((item, idx) => {
                ctx.beginPath();
                ctx.moveTo(centerX, centerY);
                ctx.arc(centerX, centerY, radius, item[0], item[1], item[2]);
                ctx.closePath();
                ctx.fillStyle = colors[idx];
                ctx.fill();
            });

            ctx.save();
            ctx.font = 'bold 15px Georgia, serif';
            ctx.fillStyle = '#64748b';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            const labelR = radius * 0.55;
            ctx.fillText('I', centerX + labelR * Math.cos(Math.PI / 4), centerY - labelR * Math.sin(Math.PI / 4));
            ctx.fillText('II', centerX + labelR * Math.cos(3 * Math.PI / 4), centerY - labelR * Math.sin(3 * Math.PI / 4));
            ctx.fillText('III', centerX + labelR * Math.cos(5 * Math.PI / 4), centerY - labelR * Math.sin(5 * Math.PI / 4));
            ctx.fillText('IV', centerX + labelR * Math.cos(7 * Math.PI / 4), centerY - labelR * Math.sin(7 * Math.PI / 4));
            ctx.restore();
        }

        function drawProtractor() {
            ctx.save();
            const pRadius = radius + 28;

            ctx.beginPath();
            ctx.arc(centerX, centerY, pRadius, 0, 2 * Math.PI);
            ctx.strokeStyle = '#64748b';
            ctx.lineWidth = 1.2;
            ctx.stroke();

            ctx.beginPath();
            ctx.arc(centerX, centerY, pRadius - 8, 0, 2 * Math.PI);
            ctx.strokeStyle = '#cbd5e1';
            ctx.lineWidth = 1;
            ctx.stroke();

            for (let a = 0; a < 360; a += 15) {
                let r = a * Math.PI / 180;
                let isCardinal = (a % 90 === 0);
                let isMajor = (a % 30 === 0 || a === 45 || a === 135 || a === 225 || a === 315);
                
                let tickLen = isCardinal ? 14 : (isMajor ? 10 : 6);
                let sx = centerX + (pRadius - tickLen) * Math.cos(r);
                let sy = centerY - (pRadius - tickLen) * Math.sin(r);
                let ex = centerX + pRadius * Math.cos(r);
                let ey = centerY - pRadius * Math.sin(r);

                ctx.beginPath();
                if (isCardinal) {
                    ctx.strokeStyle = '#0369a1';
                    ctx.lineWidth = 2.4;
                } else if (isMajor) {
                    ctx.strokeStyle = '#4338ca';
                    ctx.lineWidth = 1.6;
                } else {
                    ctx.strokeStyle = '#64748b';
                    ctx.lineWidth = 1;
                }
                ctx.moveTo(sx, sy);
                ctx.lineTo(ex, ey);
                ctx.stroke();

                let tx = centerX + (pRadius - (isCardinal ? 24 : 18)) * Math.cos(r);
                let ty = centerY - (pRadius - (isCardinal ? 24 : 18)) * Math.sin(r);

                ctx.save();
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                if (isCardinal) {
                    ctx.fillStyle = '#0369a1';
                    ctx.font = 'bold 12px sans-serif';
                } else if (isMajor) {
                    ctx.fillStyle = '#0f172a';
                    ctx.font = 'bold 10px sans-serif';
                } else {
                    ctx.fillStyle = '#475569';
                    ctx.font = '600 9px sans-serif';
                }
                ctx.fillText(a + '°', tx, ty);
                ctx.restore();
            }
            ctx.restore();
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            if (document.getElementById('cbQuadrants').checked) drawQuadrants();
            if (document.getElementById('cbProtractor').checked) drawProtractor();

            // Trục Ox, Oy
            ctx.save();
            ctx.strokeStyle = '#334155';
            ctx.lineWidth = 1.6;

            // Ox
            ctx.beginPath();
            ctx.moveTo(15, centerY); ctx.lineTo(canvas.width - 15, centerY);
            ctx.stroke();
            ctx.beginPath();
            ctx.fillStyle = '#334155';
            ctx.moveTo(canvas.width - 15, centerY);
            ctx.lineTo(canvas.width - 23, centerY - 5);
            ctx.lineTo(canvas.width - 23, centerY + 5);
            ctx.fill();
            ctx.font = 'italic bold 16px serif';
            ctx.fillText('x', canvas.width - 12, centerY - 8);

            // Oy
            ctx.beginPath();
            ctx.moveTo(centerX, canvas.height - 15); ctx.lineTo(centerX, 15);
            ctx.stroke();
            ctx.beginPath();
            ctx.moveTo(centerX, 15);
            ctx.lineTo(centerX - 5, 23);
            ctx.lineTo(centerX + 5, 23);
            ctx.fill();
            ctx.fillText('y', centerX + 10, 18);
            ctx.restore();

            // Đường tròn lượng giác
            ctx.save();
            ctx.beginPath();
            ctx.arc(centerX, centerY, radius, 0, 2 * Math.PI);
            ctx.strokeStyle = '#4338ca';
            ctx.lineWidth = 2.5;
            ctx.stroke();
            ctx.restore();

            let rad = currentAngle * Math.PI / 180;
            let endX = centerX + radius * Math.cos(rad);
            let endY = centerY - radius * Math.sin(rad);

            // Tia gợi ý
            if (document.getElementById('cbPointer').checked && targetAngle !== null) {
                ctx.save();
                let targetRad = targetAngle * Math.PI / 180;
                let tx = centerX + (radius + 6) * Math.cos(targetRad);
                let ty = centerY - (radius + 6) * Math.sin(targetRad);
                ctx.beginPath();
                ctx.strokeStyle = '#b45309';
                ctx.lineWidth = 2;
                ctx.setLineDash([4, 4]);
                ctx.moveTo(centerX, centerY);
                ctx.lineTo(tx, ty);
                ctx.stroke();
                ctx.beginPath();
                ctx.fillStyle = '#b45309';
                ctx.arc(tx, ty, 5, 0, 2 * Math.PI);
                ctx.fill();
                ctx.restore();
            }

            // Xoắn ốc số vòng quay
            ctx.save();
            let isPositive = currentAngle >= 0;
            let spiralColor = isPositive ? '#0284c7' : '#dc2626';
            ctx.strokeStyle = spiralColor;
            ctx.lineWidth = 2.2;
            ctx.beginPath();
            let steps = Math.abs(currentAngle);
            let sign = isPositive ? 1 : -1;
            let displaySteps = Math.min(steps, 1440); 
            for (let i = 0; i <= displaySteps; i += 3) {
                let spiralR = 12 + (i * 0.052); 
                let stepRad = i * sign * Math.PI / 180;
                ctx[i === 0 ? 'moveTo' : 'lineTo'](
                    centerX + spiralR * Math.cos(stepRad),
                    centerY - spiralR * Math.sin(stepRad)
                );
            }
            ctx.stroke();

            // Tia OM
            ctx.strokeStyle = spiralColor;
            ctx.lineWidth = 3.5;
            ctx.beginPath();
            ctx.moveTo(centerX, centerY);
            ctx.lineTo(endX, endY);
            ctx.stroke();

            // Điểm ngọn M
            ctx.beginPath();
            ctx.arc(endX, endY, 9, 0, 2 * Math.PI);
            ctx.fillStyle = spiralColor;
            ctx.fill();
            ctx.lineWidth = 2.5;
            ctx.strokeStyle = '#ffffff';
            ctx.stroke();

            // Nhãn điểm M dạng toán học nghiêng
            ctx.fillStyle = '#0f172a';
            ctx.font = 'italic bold 17px serif';
            ctx.fillText('M', endX + 12, endY - 8);
            ctx.restore();

            // Điểm gốc A(1; 0)
            ctx.save();
            ctx.beginPath();
            ctx.arc(centerX + radius, centerY, 5, 0, 2 * Math.PI);
            ctx.fillStyle = '#0f172a';
            ctx.fill();
            ctx.font = 'bold 13px serif';
            ctx.fillText('A(1; 0)', centerX + radius + 8, centerY + 18);
            ctx.restore();
        }

        function getAngleFromEvent(e) {
            const rect = canvas.getBoundingClientRect();
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const clientY = e.touches ? e.touches[0].clientY : e.clientY;
            
            const x = clientX - rect.left - centerX;
            const y = centerY - (clientY - rect.top); 
            
            let angleRad = Math.atan2(y, x);
            let angleDeg = angleRad * 180 / Math.PI;
            if (angleDeg < 0) angleDeg += 360; 
            return angleDeg;
        }

        function handleStart(e) {
            isDragging = true;
            previousAngle = getAngleFromEvent(e);
            if (e.cancelable) e.preventDefault();
        }

        function handleMove(e) {
            if (!isDragging) return;
            
            let newAngleBase = getAngleFromEvent(e);
            let delta = newAngleBase - previousAngle;
            
            if (delta > 180) delta -= 360;
            if (delta < -180) delta += 360;
            
            currentAngle += delta;
            
            if (currentAngle > 1440) currentAngle = 1440;
            if (currentAngle < -1440) currentAngle = -1440;
            
            previousAngle = newAngleBase;
            draw();
            if (e.cancelable) e.preventDefault();
        }

        function handleEnd() { isDragging = false; }

        canvas.addEventListener('mousedown', handleStart);
        window.addEventListener('mousemove', handleMove);
        window.addEventListener('mouseup', handleEnd);
        canvas.addEventListener('touchstart', handleStart, { passive: false });
        window.addEventListener('touchmove', handleMove, { passive: false });
        window.addEventListener('touchend', handleEnd);

        function resetToZero() {
            currentAngle = 0;
            draw();
        }

        function generateNewQuiz() {
            const baseAngles = [
                0, 15, 30, 45, 60, 75, 90, 105, 120, 135, 150, 165,
                180, 195, 210, 225, 240, 255, 270, 285, 300, 315, 330, 345
            ];
            
            const possibleTurns = [-3, -2, -1, 0, 1, 2, 3];
            
            let chosenBase = baseAngles[Math.floor(Math.random() * baseAngles.length)];
            let chosenTurn = possibleTurns[Math.floor(Math.random() * possibleTurns.length)];
            
            let calculated = chosenBase + chosenTurn * 360;

            if (calculated === targetAngle || calculated === 0) {
                chosenTurn = chosenTurn === 0 ? 1 : -chosenTurn;
                calculated = chosenBase + chosenTurn * 360;
            }

            targetAngle = calculated;
            hasCheckedCurrentQuiz = false;
            
            updateQuizDisplay();
            
            const statusBox = document.getElementById('quizStatus');
            statusBox.innerText = "🎯 Hãy xoay điểm M theo đúng góc và số vòng yêu cầu, rồi bấm Kiểm Tra!";
            statusBox.className = "quiz-status status-neutral";
            draw();
        }

        function updateQuizDisplay() {
            if (targetAngle === null) return;
            const targetElem = document.getElementById('quizTargetText');
            
            if (currentMode === 'deg') {
                targetElem.innerHTML = `$${targetAngle}^\\circ$`;
            } else {
                targetElem.innerHTML = `$${getLatexRad(targetAngle)}$`;
            }
            
            // Gọi MathJax render công thức đẹp
            if (window.MathJax && window.MathJax.typesetPromise) {
                MathJax.typesetPromise([targetElem]);
            }
        }

        function checkQuizAnswer() {
            if (targetAngle === null) {
                alert("Vui lòng bấm '🎲 Phát Đề Bài Mới' trước!");
                return;
            }
            if (hasCheckedCurrentQuiz) return; 

            let currentAngleRounded = Math.round(currentAngle);
            const statusBox = document.getElementById('quizStatus');

            let isPerfectMatch = Math.abs(currentAngleRounded - targetAngle) <= 5;

            let currentMod = ((currentAngleRounded % 360) + 360) % 360;
            let targetMod = ((targetAngle % 360) + 360) % 360;
            let diffMod = Math.abs(currentMod - targetMod);
            let isSamePosition = diffMod <= 5 || diffMod >= 355;

            if (isPerfectMatch) {
                hasCheckedCurrentQuiz = true;
                correctAnswersCount++;
                totalScore += 10;
                statusBox.innerHTML = `<b>CHÍNH XÁC (+10đ):</b> Bạn đã kéo đúng vị trí điểm M và đủ số vòng lượng giác!`;
                statusBox.className = "quiz-status status-success";
            } 
            else if (isSamePosition) {
                let turnsDiff = Math.round((currentAngleRounded - targetAngle) / 360);
                let hintMsg = "";
                if (turnsDiff > 0) {
                    hintMsg = `Đang dư khoảng ${turnsDiff} vòng tiến (+), hãy xoay lùi lại!`;
                } else if (turnsDiff < 0) {
                    hintMsg = `Đang thiếu khoảng ${Math.abs(turnsDiff)} vòng, hãy xoay tiếp!`;
                } else {
                    hintMsg = `Ngược chiều quay (âm / dương)! Hãy kiểm tra lại chiều kim đồng hồ.`;
                }
                statusBox.innerHTML = `<b>ĐÚNG ĐIỂM NGỌN NHƯNG SAI SỐ VÒNG:</b> ${hintMsg}`;
                statusBox.className = "quiz-status status-warning";
            } 
            else {
                statusBox.innerHTML = `<b>CHƯA ĐÚNG:</b> Điểm M lệch khỏi vị trí góc yêu cầu. Hãy quan sát các vạch chia 15° để kéo lại.`;
                statusBox.className = "quiz-status status-fail";
            }

            document.getElementById('txtTotalQuiz').innerText = correctAnswersCount;
            document.getElementById('txtTotalScore').innerText = totalScore;
        }

        document.getElementById('cbProtractor').addEventListener('change', draw);
        document.getElementById('cbQuadrants').addEventListener('change', draw);
        document.getElementById('cbPointer').addEventListener('change', draw);

        draw();
    </script>
</body>
</html>
