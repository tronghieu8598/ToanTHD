<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="Phòng thí nghiệm ảo minh họa giao, hợp và hiệu của các đoạn, khoảng trên trục số.">
  <title>Phòng thí nghiệm phép toán tập hợp</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect rx='14' width='64' height='64' fill='%23111d35'/%3E%3Cpath d='M12 32h40M22 24v16M42 24v16' stroke='%23fff' stroke-width='5' stroke-linecap='round'/%3E%3Cpath d='M26 32h12' stroke='%238b5cf6' stroke-width='10' stroke-linecap='round'/%3E%3C/svg%3E">
  <style>
    :root{--ink:#14213d;--muted:#61708c;--paper:#f5f7fb;--card:#fff;--line:#dce3ee;--red:#ef3f4f;--blue:#2477e8;--purple:#8b4fd6;--gold:#ffb703;--shadow:0 18px 45px rgba(20,33,61,.10)}
    *{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--ink);background:radial-gradient(circle at 88% 8%,#e7edff 0,transparent 32%),var(--paper)}
    body{min-height:100vh;padding:clamp(16px,2.2vw,32px)}
    .app{max-width:1440px;margin:auto;min-height:calc(100vh - 64px);display:grid;grid-template-columns:minmax(290px,350px) 1fr;gap:20px}
    .panel,.stage{background:rgba(255,255,255,.92);border:1px solid rgba(220,227,238,.9);border-radius:24px;box-shadow:var(--shadow)}
    .panel{padding:24px;display:flex;flex-direction:column;gap:20px}.brand{display:flex;gap:13px;align-items:center}.brandmark{width:44px;height:44px;border-radius:13px;background:var(--ink);display:grid;place-items:center;color:#fff;font-weight:900;font-size:22px}.brand h1{font-size:1.25rem;line-height:1.25;margin:0}.brand p{font-size:.85rem;color:var(--muted);margin:4px 0 0}
    fieldset{border:0;padding:0;margin:0}.label{display:block;font-weight:800;font-size:.82rem;letter-spacing:.07em;text-transform:uppercase;margin-bottom:10px;color:#53617c}.operations{display:grid;grid-template-columns:1fr 1fr;gap:8px}.op{position:relative}.op input{position:absolute;opacity:0}.op label{display:flex;align-items:center;justify-content:center;min-height:44px;padding:8px;border:1.5px solid var(--line);border-radius:12px;cursor:pointer;font-weight:800;background:#fff;transition:.18s}.op input:checked+label{color:#fff;background:var(--ink);border-color:var(--ink);box-shadow:0 8px 18px rgba(20,33,61,.18)}
    .set-card{border:1px solid var(--line);border-radius:16px;padding:15px}.set-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:12px}.set-name{display:flex;align-items:center;gap:8px;font-weight:900}.set-actions{display:flex;align-items:center;gap:10px}.dot{width:12px;height:12px;border-radius:50%}.notation{font:800 1.08rem ui-monospace,SFMono-Regular,Consolas,monospace}.axis-toggle{display:flex;align-items:center;gap:5px;padding:5px 8px;border:1px solid var(--line);border-radius:9px;color:var(--muted);font-size:.74rem;font-weight:800;cursor:pointer;background:#f8faff}.axis-toggle input{width:16px;height:16px;margin:0;accent-color:var(--ink)}.axis-toggle:has(input:checked){color:var(--ink);background:#eef2fa}.bounds{display:grid;grid-template-columns:1fr 1fr;gap:10px}.bound label{font-size:.78rem;color:var(--muted);display:block;margin-bottom:5px}.bound input[type=number]{width:100%;height:40px;border:1.5px solid var(--line);border-radius:10px;padding:0 10px;font-weight:800;font-size:1rem;color:var(--ink);outline:none}.bound input:focus{border-color:#8395b8;box-shadow:0 0 0 3px #e8edfb}.included{display:flex;align-items:center;gap:7px;margin-top:8px;font-size:.8rem;cursor:pointer}.included input{accent-color:var(--ink);width:17px;height:17px}
    .show-row{display:flex;align-items:center;justify-content:space-between;padding-top:2px;border-top:1px solid var(--line)}.switch{position:relative;width:48px;height:27px}.switch input{opacity:0;width:0}.slider{position:absolute;inset:0;background:#c6cfdd;border-radius:20px;cursor:pointer;transition:.2s}.slider:before{content:"";position:absolute;width:21px;height:21px;left:3px;top:3px;background:white;border-radius:50%;box-shadow:0 2px 5px #8290a6;transition:.2s}.switch input:checked+.slider{background:var(--ink)}.switch input:checked+.slider:before{transform:translateX(21px)}
    .stage{padding:clamp(18px,2.4vw,34px);display:flex;flex-direction:column;min-width:0}.stage-head{display:flex;align-items:flex-start;justify-content:space-between;gap:20px}.stage h2{font-size:clamp(1.25rem,2vw,1.8rem);margin:0 0 6px}.hint{color:var(--muted);font-size:.93rem;margin:0}.legend{display:flex;gap:14px;flex-wrap:wrap;justify-content:flex-end}.legend span{display:flex;align-items:center;gap:6px;font-size:.82rem;font-weight:700}.legend i{display:block;width:22px;height:8px;border-radius:6px}
    .canvas-wrap{flex:1;min-height:380px;display:flex;align-items:center}.axis-svg{width:100%;min-height:380px;overflow:visible;touch-action:none}.axis{stroke:#111827;stroke-width:3}.tick{stroke:#111827;stroke-width:2}.axis-label{font-size:14px;font-weight:800;fill:#42506b}.interval{stroke-width:22;stroke-linecap:butt}.endpoint-mark{font:900 33px Georgia,serif;dominant-baseline:middle}.handle{cursor:ew-resize}.handle-line{stroke:#14213d;stroke-width:2;stroke-dasharray:3 3}.handle-pill{fill:#fff;stroke-width:2}.handle-text{font-size:14px;font-weight:900;text-anchor:middle;dominant-baseline:middle;fill:#14213d}.result-label{font-size:15px;font-weight:900;fill:#14213d}.empty-text{font-size:16px;font-weight:800;fill:#8a97ac;text-anchor:middle}
    .result-card{border:1px solid var(--line);background:#f9fbff;border-radius:18px;padding:18px 20px;transition:.2s}.result-card.hidden{display:none}.result-title{display:flex;align-items:center;gap:9px;color:var(--muted);font-size:.8rem;font-weight:800;text-transform:uppercase;letter-spacing:.08em;margin-bottom:8px}.result-expression{font:800 clamp(1.05rem,2.2vw,1.45rem) ui-monospace,SFMono-Regular,Consolas,monospace;line-height:1.55;overflow-wrap:anywhere}.a-text{color:var(--red)}.b-text{color:var(--blue)}.mix-text{color:var(--purple)}.blue-text{color:var(--blue)}.red-text{color:var(--red)}.empty{color:#8390a7}.error{color:#b42318;font-size:.82rem;min-height:18px;margin-top:7px}
    @media(max-width:900px){body{padding:12px}.app{grid-template-columns:1fr;min-height:auto}.panel{order:2}.stage{min-height:560px}.canvas-wrap{min-height:360px}.stage-head{flex-direction:column}.legend{justify-content:flex-start}.operations{grid-template-columns:repeat(4,1fr)}}
    @media(max-width:560px){.operations{grid-template-columns:1fr 1fr}.panel,.stage{border-radius:18px;padding:17px}.bounds{gap:7px}.legend{gap:8px}.axis-svg{min-height:330px}.canvas-wrap{min-height:330px}}
  </style>
</head>
<body>
<main class="app">
  <aside class="panel" aria-label="Bảng điều khiển">
    <div class="brand"><div class="brandmark">∩</div><div><h1>Phép toán tập hợp</h1><p>Đoạn · khoảng · nửa khoảng</p></div></div>
    <fieldset><legend class="label">Chọn phép toán</legend><div class="operations">
      <div class="op"><input id="inter" type="radio" name="op" value="intersection" checked><label for="inter">A ∩ B</label></div>
      <div class="op"><input id="union" type="radio" name="op" value="union"><label for="union">A ∪ B</label></div>
      <div class="op"><input id="ab" type="radio" name="op" value="aMinusB"><label for="ab">A \ B</label></div>
      <div class="op"><input id="ba" type="radio" name="op" value="bMinusA"><label for="ba">B \ A</label></div>
    </div></fieldset>
    <section class="set-card" data-set="A"><div class="set-head"><div class="set-name"><span class="dot" style="background:var(--red)"></span>Tập A</div><div class="set-actions"><span class="notation a-text" id="notationA"></span><label class="axis-toggle" title="Bật hoặc tắt tập A trên trục số"><input id="showA" type="checkbox" checked> 👁 Trục</label></div></div><div class="bounds">
      <div class="bound"><label for="aL">Biên trái</label><input id="aL" type="number" step="1" value="-2"><label class="included"><input id="aLI" type="checkbox" checked> Lấy biên</label></div>
      <div class="bound"><label for="aR">Biên phải</label><input id="aR" type="number" step="1" value="5"><label class="included"><input id="aRI" type="checkbox"> Lấy biên</label></div>
    </div><div class="error" id="errorA"></div></section>
    <section class="set-card" data-set="B"><div class="set-head"><div class="set-name"><span class="dot" style="background:var(--blue)"></span>Tập B</div><div class="set-actions"><span class="notation b-text" id="notationB"></span><label class="axis-toggle" title="Bật hoặc tắt tập B trên trục số"><input id="showB" type="checkbox" checked> 👁 Trục</label></div></div><div class="bounds">
      <div class="bound"><label for="bL">Biên trái</label><input id="bL" type="number" step="1" value="2"><label class="included"><input id="bLI" type="checkbox"> Lấy biên</label></div>
      <div class="bound"><label for="bR">Biên phải</label><input id="bR" type="number" step="1" value="8"><label class="included"><input id="bRI" type="checkbox" checked> Lấy biên</label></div>
    </div><div class="error" id="errorB"></div></section>
    <div class="show-row"><div><strong>Hiển thị phép toán</strong><div style="font-size:.78rem;color:var(--muted);margin-top:3px">Bật/tắt thẻ kết quả</div></div><label class="switch"><input id="showResult" type="checkbox" checked aria-label="Hiển thị kết quả"><span class="slider"></span></label></div>
  </aside>
  <section class="stage">
    <header class="stage-head"><div><h2>Trục số tương tác</h2><p class="hint">Kéo các nhãn số để thay đổi biên của A và B.</p></div><div class="legend" id="legend"></div></header>
    <div class="canvas-wrap"><svg id="axisSvg" class="axis-svg" viewBox="0 0 980 380" role="img" aria-label="Biểu diễn các tập hợp trên trục số"></svg></div>
    <div class="result-card" id="resultCard"><div class="result-title"><span>✦</span> Phép toán và kết quả</div><div class="result-expression" id="resultText"></div></div>
  </section>
</main>
<script>
  const $=id=>document.getElementById(id); const NS='http://www.w3.org/2000/svg';
  const state={op:'intersection',drag:null};
  const el={aL:$('aL'),aR:$('aR'),aLI:$('aLI'),aRI:$('aRI'),bL:$('bL'),bR:$('bR'),bLI:$('bLI'),bRI:$('bRI'),svg:$('axisSvg')};
  function readSet(k){return {l:Number(el[k.toLowerCase()+'L'].value),r:Number(el[k.toLowerCase()+'R'].value),li:el[k.toLowerCase()+'LI'].checked,ri:el[k.toLowerCase()+'RI'].checked,name:k}}
  function valid(s){return Number.isFinite(s.l)&&Number.isFinite(s.r)&&s.l<s.r}
  function fmtNum(n){return Number.isInteger(n)?String(n):String(Math.round(n*10)/10)}
  function fmt(s){return `${s.li?'[':'('}${fmtNum(s.l)}; ${fmtNum(s.r)}${s.ri?']':')'}`}
  function intersect(a,b){const l=Math.max(a.l,b.l),r=Math.min(a.r,b.r);let li=(l===a.l?a.li:true)&&(l===b.l?b.li:true),ri=(r===a.r?a.ri:true)&&(r===b.r?b.ri:true);if(l<r||l===r&&li&&ri)return [{l,r,li,ri}];return []}
  function union(a,b){let x=a.l<b.l||a.l===b.l&&a.li?[a,b]:[b,a],p=x[0],q=x[1];if(p.r>q.l||p.r===q.l&&(p.ri||q.li)){return [{l:p.l,r:Math.max(p.r,q.r),li:p.li,ri:p.r>q.r?p.ri:p.r<q.r?q.ri:(p.ri||q.ri)}]}return [p,q]}
  function minus(a,b){const ov=intersect(a,b)[0];if(!ov)return [a];const out=[];if(a.l<ov.l||a.l===ov.l&&a.li&&!ov.li)out.push({l:a.l,r:ov.l,li:a.li,ri:!ov.li});if(ov.r<a.r||ov.r===a.r&&a.ri&&!ov.ri)out.push({l:ov.r,r:a.r,li:!ov.ri,ri:a.ri});return out.filter(s=>s.l<s.r||s.l===s.r&&s.li&&s.ri)}
  function result(a,b){return state.op==='intersection'?intersect(a,b):state.op==='union'?union(a,b):state.op==='aMinusB'?minus(a,b):minus(b,a)}
  function svgEl(tag,attrs={},text=''){const n=document.createElementNS(NS,tag);Object.entries(attrs).forEach(([k,v])=>n.setAttribute(k,v));if(text)n.textContent=text;return n}
  function render(){const a=readSet('A'),b=readSet('B'),okA=valid(a),okB=valid(b);$('errorA').textContent=okA?'':'Biên trái phải nhỏ hơn biên phải.';$('errorB').textContent=okB?'':'Biên trái phải nhỏ hơn biên phải.';$('notationA').textContent=okA?fmt(a):'—';$('notationB').textContent=okB?fmt(b):'—';if(!okA||!okB){el.svg.innerHTML='';$('resultText').innerHTML='<span class="empty">Hãy nhập lại các giá trị biên hợp lệ.</span>';return}
    const vals=[a.l,a.r,b.l,b.r],min=Math.min(...vals),max=Math.max(...vals),span=Math.max(4,max-min),lo=Math.floor(min-span*.18-1),hi=Math.ceil(max+span*.18+1),x=v=>95+(v-lo)/(hi-lo)*805;
    const res=result(a,b),showA=$('showA').checked,showB=$('showB').checked;el.svg.innerHTML='';
    const defs=svgEl('defs');const marker=svgEl('marker',{id:'arrow',viewBox:'0 0 10 10',refX:'7',refY:'5',markerWidth:'7',markerHeight:'7',orient:'auto-start-reverse'});marker.append(svgEl('path',{d:'M 0 0 L 10 5 L 0 10 z',fill:'#111827'}));defs.append(marker);el.svg.append(defs);
    el.svg.append(svgEl('line',{x1:70,y1:155,x2:925,y2:155,class:'axis','marker-start':'url(#arrow)','marker-end':'url(#arrow)'}));
    [lo,hi].forEach(v=>{el.svg.append(svgEl('line',{x1:x(v),y1:147,x2:x(v),y2:163,class:'tick'}))});
    const colors=state.op==='union'?{A:'#2477e8',B:'#2477e8'}:{A:'#ef3f4f',B:'#2477e8'};
    function line(s,color,opacity=1){el.svg.append(svgEl('line',{x1:x(s.l),x2:x(s.r),y1:155,y2:155,class:'interval',stroke:color,opacity}))}
    if(state.op==='aMinusB'){if(showA)line(a,colors.A);if(showB)line(b,colors.B)}else if(state.op==='bMinusA'){if(showB)line(b,colors.B);if(showA)line(a,colors.A)}else{if(showA)line(a,colors.A);if(showB)line(b,colors.B,state.op==='intersection'?.82:1);if(state.op==='intersection'&&showA&&showB)intersect(a,b).forEach(s=>line(s,'#8b4fd6'))}
    function endpoints(s,k,yText,yPill,color){[['l','li'],['r','ri']].forEach(([side,inc])=>{const xx=x(s[side]),left=side==='l',sym=left?(s[inc]?'[':'('):(s[inc]?']':')');el.svg.append(svgEl('text',{x:xx+(left?-9:9),y:yText,class:'endpoint-mark',fill:color,'text-anchor':left?'end':'start'},sym));const g=svgEl('g',{class:'handle','data-key':k+side.toUpperCase()});g.append(svgEl('line',{x1:xx,y1:yPill>155?172:138,x2:xx,y2:yPill>155?yPill-18:yPill+18,class:'handle-line'}));g.append(svgEl('rect',{x:xx-27,y:yPill-15,width:54,height:30,rx:10,class:'handle-pill',stroke:color}));g.append(svgEl('text',{x:xx,y:yPill+1,class:'handle-text'},fmtNum(s[side])));el.svg.append(g)})}
    if(showA)endpoints(a,'a',119,76,colors.A);if(showB)endpoints(b,'b',191,235,colors.B);
    el.svg.append(svgEl('text',{x:62,y:277,class:'result-label'},'Kết quả'));el.svg.append(svgEl('line',{x1:95,y1:300,x2:900,y2:300,class:'axis'}));
    const rc=state.op==='intersection'?'#8b4fd6':state.op==='aMinusB'?'#ef3f4f':'#2477e8';
    if(res.length){
      res.forEach(s=>{
        el.svg.append(svgEl('line',{x1:x(s.l),x2:x(s.r),y1:300,y2:300,class:'interval',stroke:rc}));
        [['l','li'],['r','ri']].forEach(([side,inc])=>{
          const symbol=side==='l'?(s[inc]?'[':'('):(s[inc]?']':')');
          el.svg.append(svgEl('text',{x:x(s[side])+(side==='l'?-9:9),y:300,class:'endpoint-mark',fill:rc,'text-anchor':side==='l'?'end':'start'},symbol));
        });
      });
    }else el.svg.append(svgEl('text',{x:497,y:306,class:'empty-text'},'∅  (tập rỗng)'));
    const opSym={intersection:'∩',union:'∪',aMinusB:'\\',bMinusA:'\\'}[state.op],left=state.op==='bMinusA'?b:a,right=state.op==='bMinusA'?a:b,resultStr=res.length?res.map(fmt).join('∪'):'∅',resultClass=state.op==='intersection'?'mix-text':state.op==='aMinusB'?'red-text':'blue-text',leftClass=state.op==='union'?'blue-text':left.name==='A'?'a-text':'b-text',rightClass=state.op==='union'?'blue-text':right.name==='A'?'a-text':'b-text';$('resultText').innerHTML=`<span class="${leftClass}">${left.name}</span><span>${opSym}</span><span class="${rightClass}">${right.name}</span><span>=</span><span class="${leftClass}">${fmt(left)}</span><span>${opSym}</span><span class="${rightClass}">${fmt(right)}</span><span>=</span><span class="${resultClass}">${resultStr}</span>`;
    let legend=[];if(showA)legend.push([colors.A,'Tập A']);if(showB)legend.push([colors.B,'Tập B']);if(state.op==='intersection'&&showA&&showB)legend.push(['#8b4fd6','Phần giao']);$('legend').innerHTML=legend.length?legend.map(([c,t])=>`<span><i style="background:${c}"></i>${t}</span>`).join(''):'<span style="color:var(--muted)">A và B đang được ẩn</span>';
    el.svg.querySelectorAll('.handle').forEach(g=>g.addEventListener('pointerdown',e=>{state.drag=g.dataset.key;el.svg.setPointerCapture(e.pointerId);e.preventDefault()}));state.map={lo,hi};
  }
  el.svg.addEventListener('pointermove',e=>{if(!state.drag)return;const p=el.svg.createSVGPoint();p.x=e.clientX;p.y=e.clientY;const q=p.matrixTransform(el.svg.getScreenCTM().inverse()),v=Math.round((state.map.lo+(q.x-95)/805*(state.map.hi-state.map.lo))*10)/10;const input=$(state.drag);input.value=v;render()});
  el.svg.addEventListener('pointerup',()=>state.drag=null);el.svg.addEventListener('pointercancel',()=>state.drag=null);
  document.querySelectorAll('input').forEach(i=>i.addEventListener('input',e=>{if(e.target.name==='op')state.op=e.target.value;$('resultCard').classList.toggle('hidden',!$('showResult').checked);render()}));render();
</script>
</body></html>
