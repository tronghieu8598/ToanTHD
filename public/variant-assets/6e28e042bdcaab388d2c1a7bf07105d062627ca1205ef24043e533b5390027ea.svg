<svg xmlns="http://www.w3.org/2000/svg" width="320" height="200" viewBox="0 0 320 200">
  <rect x="0" y="0" width="320" height="200" fill="#ffffff"/>
  <!-- Original rectangle ABCD: D top-left (55,35), C top-right (265,35), B bottom-right (265,155), A bottom-left (55,155) -->
  <rect x="55" y="35" width="210" height="120" fill="#fafafa" stroke="#111111" stroke-width="1.4"/>
  <!-- Dashed original corner ANP: N(55,65), A(55,155), P(160,155) -->
  <line x1="55" y1="65" x2="55" y2="155" stroke="#666666" stroke-width="1.1" stroke-dasharray="4,3"/>
  <line x1="55" y1="155" x2="160" y2="155" stroke="#666666" stroke-width="1.1" stroke-dasharray="4,3"/>
  <!-- Folded triangle MNP: N(55,65), M(139,35), P(160,155) -->
  <polygon points="55,65 139,35 160,155" fill="#e6effa" stroke="#111111" stroke-width="1.5"/>
  <line x1="55" y1="65" x2="160" y2="155" stroke="#111111" stroke-width="1.8"/>
  <text x="41" y="33" font-family="DejaVu Serif, Georgia, serif" font-size="13" font-style="italic" fill="#000000">D</text>
  <text x="270" y="33" font-family="DejaVu Serif, Georgia, serif" font-size="13" font-style="italic" fill="#000000">C</text>
  <text x="270" y="165" font-family="DejaVu Serif, Georgia, serif" font-size="13" font-style="italic" fill="#000000">B</text>
  <text x="41" y="165" font-family="DejaVu Serif, Georgia, serif" font-size="13" font-style="italic" fill="#000000">A</text>
  <text x="40" y="70" font-family="DejaVu Serif, Georgia, serif" font-size="13" font-style="italic" fill="#000000">N</text>
  <text x="139" y="25" font-family="DejaVu Serif, Georgia, serif" font-size="13" font-style="italic" text-anchor="middle" fill="#000000">M</text>
  <text x="160" y="172" font-family="DejaVu Serif, Georgia, serif" font-size="13" font-style="italic" text-anchor="middle" fill="#000000">P</text>
  <text x="115" y="106" font-family="DejaVu Serif, Georgia, serif" font-size="13" font-style="italic" fill="#000000">L</text>
  <text x="43" y="115" font-family="DejaVu Serif, Georgia, serif" font-size="12.5" font-style="italic" fill="#000000">x</text>
  <text x="95" y="62" font-family="DejaVu Serif, Georgia, serif" font-size="12.5" font-style="italic" fill="#000000">x</text>
  <text x="285" y="100" font-family="DejaVu Serif, Georgia, serif" font-size="12.5" text-anchor="middle" fill="#000000">8 cm</text>
  <text x="210" y="25" font-family="DejaVu Serif, Georgia, serif" font-size="12.5" text-anchor="middle" fill="#000000">16 cm</text>
