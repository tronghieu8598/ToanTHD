<svg xmlns="http://www.w3.org/2000/svg" width="320" height="195" viewBox="0 0 320 195">
  <rect x="0" y="0" width="320" height="195" fill="#ffffff"/>
  <polygon points="55,40 55,145 265,145 265,40" fill="#eef7ff" stroke="none"/>
  <!-- Shore line pt_foot to pt_end -->
  <line x1="45" y1="145" x2="275" y2="145" stroke="#111111" stroke-width="1.8"/>
  <!-- Perpendicular segment pt_top to pt_foot -->
  <line x1="65" y1="45" x2="65" y2="145" stroke="#333333" stroke-width="1.3" stroke-dasharray="4,3"/>
  <!-- Right angle symbol at pt_foot -->
  <polyline points="65,135 75,135 75,145" fill="none" stroke="#333333" stroke-width="1.0"/>
  <!-- Diagonal path pt_top -> pt_mid -> pt_end -->
  <line x1="65" y1="45" x2="155" y2="145" stroke="#111111" stroke-width="1.8"/>
  <line x1="155" y1="145" x2="255" y2="145" stroke="#111111" stroke-width="2.2"/>
  <circle cx="65" cy="45" r="2.8" fill="#000000"/>
  <circle cx="65" cy="145" r="2.5" fill="#000000"/>
  <circle cx="155" cy="145" r="2.8" fill="#000000"/>
  <circle cx="255" cy="145" r="2.8" fill="#000000"/>
  <text x="65" y="34" font-family="DejaVu Serif, Georgia, serif" font-size="14" font-style="italic" text-anchor="middle" fill="#000000">C</text>
  <text x="65" y="164" font-family="DejaVu Serif, Georgia, serif" font-size="14" font-style="italic" text-anchor="middle" fill="#000000">B</text>
  <text x="155" y="164" font-family="DejaVu Serif, Georgia, serif" font-size="14" font-style="italic" text-anchor="middle" fill="#000000">S</text>
  <text x="255" y="164" font-family="DejaVu Serif, Georgia, serif" font-size="14" font-style="italic" text-anchor="middle" fill="#000000">A</text>
  <text x="34" y="98" font-family="DejaVu Serif, Georgia, serif" font-size="12.5" text-anchor="middle" fill="#000000">2 km</text>
  <text x="160" y="184" font-family="DejaVu Serif, Georgia, serif" font-size="12.5" text-anchor="middle" fill="#000000">BA = 6 km</text>
</svg>