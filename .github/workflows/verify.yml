name: Kiểm tra Toán THĐ

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      TOANTHD_GIT_CHECKOUT: '1'
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm run install:ci
      - run: npm run content:check
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
